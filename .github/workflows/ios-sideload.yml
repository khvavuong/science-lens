name: iOS personal-device IPA
on:
  push:
    branches: [codex/ios-sideload]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_PUBLIC_API_URL: ${{ vars.SCANSCIENCE_API_URL }}
      EXPO_PUBLIC_API_TOKEN: ${{ secrets.SCANSCIENCE_API_TOKEN }}
      SCANSCIENCE_SIDELOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: test -n "$EXPO_PUBLIC_API_URL"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run lint
      - run: node app.config.test.cjs
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Build unsigned device archive
        run: |
          set -o pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LumosLens.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/LumosLens.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/ipa/Payload/"
          test -f "$RUNNER_TEMP/ipa/Payload/"*.app/Info.plist
          plist=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 2 -name Info.plist -print -quit)
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist")"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload ScanScience-unsigned.ipa
          unzip -t ScanScience-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ScanScience-iphone-unsigned
          path: ${{ runner.temp }}/ipa/ScanScience-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log
