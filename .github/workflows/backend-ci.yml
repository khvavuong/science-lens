name: Backend CI/CD
on:
  pull_request:
    paths: ['server/**', 'supabase/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['server/**', 'supabase/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node --import tsx --test src/*.test.ts
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_UBknBFXYNjGpPdttQiZUxgR5
      VERCEL_PROJECT_ID: prj_mQV3awk1SeAPmSFAlnWQfjSNkfh6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Check deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'Set the VERCEL_TOKEN repository secret before deploying.' >&2
            exit 1
          fi
      - run: npm install --global vercel@53.2.0
      - name: Deploy existing production backend
        run: |
          deployment_url=$(vercel deploy --prod --yes --no-wait --scope hungbils-projects --token "$VERCEL_TOKEN")
          for attempt in {1..60}; do
            state=$(vercel inspect "$deployment_url" --format=json --scope hungbils-projects --token "$VERCEL_TOKEN" | jq -er '.readyState')
            echo "Deployment: $state ($deployment_url)"
            case "$state" in
              READY) exit 0 ;;
              BLOCKED|ERROR|CANCELED) exit 1 ;;
              QUEUED|INITIALIZING|BUILDING) sleep 10 ;;
              *) echo "Unexpected deployment state: $state" >&2; exit 1 ;;
            esac
          done
          echo 'Deployment did not become ready within 10 minutes.' >&2
          exit 1
